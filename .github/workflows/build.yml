name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find bundle files
        id: find_bundles
        shell: pwsh
        run: |
          $paths = @(
            "src-tauri\target\release\bundle",
            "$env:USERPROFILE\.cargo-target\release\bundle"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Found bundles at: $p"
              $files = Get-ChildItem -Path $p -Recurse -Include "*.exe","*.msi" | Select-Object -ExpandProperty FullName
              Write-Host "Files: $files"
              echo "bundle_path=$p" >> $env:GITHUB_OUTPUT
              break
            }
          }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: dock-tester-windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            ${{ env.USERPROFILE }}/.cargo-target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: dock-tester-windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ env.USERPROFILE }}/.cargo-target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 30
