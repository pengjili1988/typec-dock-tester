name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy bundles to workspace
        shell: pwsh
        run: |
          $searchPaths = @(
            "src-tauri\target\release\bundle",
            "$env:USERPROFILE\.cargo-target\release\bundle",
            "C:\Users\runneradmin\.cargo-target\release\bundle"
          )
          New-Item -ItemType Directory -Force -Path "dist-bundles\msi"
          New-Item -ItemType Directory -Force -Path "dist-bundles\nsis"
          foreach ($base in $searchPaths) {
            $msiDir = "$base\msi"
            $nsisDir = "$base\nsis"
            if (Test-Path $msiDir) {
              Write-Host "Found MSI dir: $msiDir"
              Get-ChildItem -Path $msiDir -Filter "*.msi" | ForEach-Object {
                Copy-Item $_.FullName -Destination "dist-bundles\msi\" -Force
                Write-Host "Copied: $($_.Name)"
              }
            }
            if (Test-Path $nsisDir) {
              Write-Host "Found NSIS dir: $nsisDir"
              Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | ForEach-Object {
                Copy-Item $_.FullName -Destination "dist-bundles\nsis\" -Force
                Write-Host "Copied: $($_.Name)"
              }
            }
          }
          Get-ChildItem -Recurse "dist-bundles"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: dock-tester-windows-installers
          path: dist-bundles/
          if-no-files-found: error
          retention-days: 30
