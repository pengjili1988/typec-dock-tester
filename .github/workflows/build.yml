name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and copy installers
        shell: pwsh
        run: |
          # 列出所有可能的bundle目录
          $possibleBases = @(
            "src-tauri\target\release\bundle",
            "C:\Users\Administrator\.cargo-target\release\bundle",
            "C:\Users\runneradmin\.cargo-target\release\bundle"
          )
          
          New-Item -ItemType Directory -Force -Path "dist-bundles" | Out-Null
          $found = $false
          
          foreach ($base in $possibleBases) {
            Write-Host "Checking: $base"
            if (Test-Path $base) {
              Write-Host "EXISTS: $base"
              # 复制所有安装文件
              Get-ChildItem -Path $base -Recurse -Include "*.msi","*-setup.exe" | ForEach-Object {
                $dest = "dist-bundles\$($_.Name)"
                Write-Host "Copying $($_.FullName) -> $dest"
                Copy-Item $_.FullName -Destination $dest -Force
                $found = $true
              }
            }
          }
          
          if (-not $found) {
            Write-Host "WARNING: No installers found in known paths. Searching entire system..."
            Get-ChildItem -Path "C:\Users" -Recurse -Include "*.msi","*-setup.exe" -ErrorAction SilentlyContinue | 
              Where-Object { $_.FullName -like "*bundle*" } | 
              ForEach-Object {
                Write-Host "Found: $($_.FullName)"
                Copy-Item $_.FullName -Destination "dist-bundles\" -Force
              }
          }
          
          Write-Host "--- Contents of dist-bundles ---"
          Get-ChildItem "dist-bundles" | ForEach-Object { Write-Host $_.Name, $_.Length }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: dock-tester-windows-installers
          path: dist-bundles/
          if-no-files-found: error
          retention-days: 30
